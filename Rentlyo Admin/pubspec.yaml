name: rentlyo_admin
description: LeaseSync Admin App (Owner Console) for Rentlyo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^8.0.0
  ota_update: ^7.1.0
  http: ^1.2.0
  path_provider: ^2.1.0
  open_filex: ^4.6.0
  excel: ^4.0.6
  csv: ^6.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  intl: ^0.20.2
  google_fonts: ^6.3.3
  image_picker: ^1.2.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#044040"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter_native_splash:
  color: "#044040"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#044040"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

